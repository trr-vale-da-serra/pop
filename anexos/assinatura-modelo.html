<!--
  Modelo de assinatura de e-mail. Ver anexos/padrao-email.md, secao 3.
  Trocar os campos {{ }} e abrir no navegador para copiar.
  Tabela + estilos inline: e o formato que o Outlook e os webmails respeitam.
-->
<table cellpadding="0" cellspacing="0" border="0" style="font-family: Arial, Helvetica, sans-serif; font-size: 13px; line-height: 18px; color: #333333;">
  <tr>
    <td style="padding: 0 14px 0 0; border-right: 2px solid {{COR_EMPRESA}}; vertical-align: middle;">
      <img src="{{LOGO_URL}}" alt="{{EMPRESA}}" width="110" style="display: block; border: 0; max-width: 110px; height: auto;">
    </td>
    <td style="padding: 0 0 0 14px; vertical-align: middle;">
      <div style="font-size: 15px; font-weight: bold; color: #222222;">{{NOME}}</div>
      <div style="color: #555555;">{{CARGO}} &middot; {{EMPRESA}}</div>
      <div style="padding-top: 4px;">
        <a href="https://wa.me/{{TELEFONE_LINK}}" style="color: {{COR_EMPRESA}}; text-decoration: none;">{{TELEFONE}}</a>
      </div>
    </td>
  </tr>
</table>

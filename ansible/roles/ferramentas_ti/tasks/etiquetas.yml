---
# Etiquetas de patrimônio do GLPI na Zebra ZD220, ligada no USB do servidor.
# A fila é "raw": o glpi-etiqueta manda ZPL pronto e o CUPS só repassa.
- name: CUPS e o Pillow (logo na etiqueta)
  ansible.builtin.apt:
    name: [cups, python3-pil]
    state: present

- name: Pasta do símbolo
  ansible.builtin.file:
    path: /usr/local/share/glpi-etiqueta
    state: directory
    mode: "0755"

# A gota do logo, sem texto (sai nos itens TRR-* e POSTOS-*).
- name: Símbolo da empresa
  ansible.builtin.copy:
    src: logos/simbolo.png
    dest: /usr/local/share/glpi-etiqueta/simbolo.png
    mode: "0644"

- name: Comando glpi-etiqueta
  ansible.builtin.template:
    src: glpi-etiqueta.j2
    dest: /usr/local/sbin/glpi-etiqueta
    mode: "0750"

# O módulo usblp do kernel segura a Zebra e o CUPS não consegue tirar ("Failed to
# detach usblp"): sem ele, o CUPS fala com a impressora direto pelo USB.
- name: Bloquear o módulo usblp
  ansible.builtin.copy:
    dest: /etc/modprobe.d/ti-sem-usblp.conf
    content: |
      # Gerado pelo Ansible (role ferramentas_ti): o CUPS usa a Zebra direto pelo USB.
      blacklist usblp
    mode: "0644"

- name: Tirar o usblp, se carregado
  community.general.modprobe:
    name: usblp
    state: absent

- name: Procurar a Zebra no USB
  ansible.builtin.shell: lpinfo -v | awk '$2 ~ /^usb:\/\/Zebra/ { print $2; exit }'
  register: zebra_usb
  changed_when: false

- name: Fila atual
  ansible.builtin.command: lpstat -v {{ etiqueta_fila }}
  register: zebra_fila
  changed_when: false
  failed_when: false

- name: Fila da Zebra no CUPS
  ansible.builtin.command: >-
    lpadmin -p {{ etiqueta_fila }} -E -v {{ zebra_usb.stdout | quote }} -m raw
    -D "Zebra ZD220 (etiquetas do GLPI)"
  when: zebra_usb.stdout | length > 0 and zebra_usb.stdout not in zebra_fila.stdout

- name: Aviso da Zebra
  ansible.builtin.debug:
    msg: "Zebra não achada no USB: ligar e rodar de novo com --tags ferramentas_ti para criar a fila {{ etiqueta_fila }}."
  when: zebra_usb.stdout | length == 0

---
# O Ubuntu 26.04 não tem o pacote glpi-agent: usa o .deb oficial, mesma versão do Windows.
- name: GLPI Agent
  ansible.builtin.apt:
    deb: "https://github.com/glpi-project/glpi-agent/releases/download/{{ glpi_agent_versao }}/glpi-agent_{{ glpi_agent_versao }}-1_all.deb"

- name: Servidor do GLPI
  ansible.builtin.copy:
    dest: /etc/glpi-agent/conf.d/ti.cfg
    content: |
      server = {{ glpi_url }}
      tag = {{ inventory_hostname.split('-')[0] }}
    mode: "0644"
  notify: Reiniciar glpi-agent

- name: GLPI Agent ligado
  ansible.builtin.service:
    name: glpi-agent
    state: started
    enabled: true

# Primeiro inventário já agora, sem esperar o agente rodar sozinho.
- name: Inventário no GLPI agora
  ansible.builtin.command: glpi-agent --force
  changed_when: false

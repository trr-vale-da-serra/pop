---
# POP-04 §4.2: MeshCentral e GLPI Agent.
# Cada agente só é instalado quando o servidor dele está configurado em group_vars/linux.
- name: MeshCentral
  ansible.builtin.include_tasks: meshcentral.yml
  when: meshcentral_url | length > 0 and (meshcentral_meshid | default('')) | length > 0

- name: GLPI Agent
  ansible.builtin.include_tasks: glpi.yml
  when: glpi_url | length > 0

- name: AnyDesk (só PCs com suporte de fornecedor, POP-TI §3.2)
  ansible.builtin.include_tasks: anydesk.yml
  when: anydesk | bool

- name: Agentes pulados
  ansible.builtin.debug:
    msg: "Ainda sem servidor configurado: {{ pulados | join(', ') }}"
  vars:
    pulados: >-
      {{ (['MeshCentral'] if meshcentral_url | length == 0 or (meshcentral_meshid | default('')) | length == 0 else [])
         + (['GLPI'] if glpi_url | length == 0 else []) }}
  when: pulados | length > 0

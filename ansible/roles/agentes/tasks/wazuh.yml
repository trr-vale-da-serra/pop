---
- name: Repositório do Wazuh
  ansible.builtin.deb822_repository:
    name: wazuh
    types: deb
    uris: https://packages.wazuh.com/4.x/apt/
    suites: stable
    components: main
    signed_by: https://packages.wazuh.com/key/GPG-KEY-WAZUH

- name: Agente Wazuh
  ansible.builtin.apt:
    name: wazuh-agent
    state: present
    update_cache: true
  environment:
    WAZUH_MANAGER: "{{ wazuh_manager }}"
    WAZUH_AGENT_NAME: "{{ inventory_hostname }}"
    WAZUH_AGENT_GROUP: "{{ wazuh_grupo }}"

- name: Endereço do servidor Wazuh
  ansible.builtin.replace:
    path: /var/ossec/etc/ossec.conf
    regexp: '<address>.*</address>'
    replace: '<address>{{ wazuh_manager }}</address>'
  notify: Reiniciar wazuh-agent

# Sem isso o agente é atualizado junto com o resto e pode ficar mais novo que o servidor.
- name: Segurar a versão do agente Wazuh
  ansible.builtin.dpkg_selections:
    name: wazuh-agent
    selection: hold

- name: Agente Wazuh ligado
  ansible.builtin.service:
    name: wazuh-agent
    state: started
    enabled: true

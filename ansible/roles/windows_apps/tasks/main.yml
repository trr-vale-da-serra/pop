---
# Programas padrão (POP-05 §4.2). Programa novo segue o POP-08 e entra em
# windows_choco (group_vars/windows). PDF: o Edge já abre.
- name: Programas padrão (Chocolatey)
  chocolatey.chocolatey.win_chocolatey:
    name: "{{ item.name }}"
    package_params: "{{ item.params | default(omit) }}"
    install_args: "{{ item.args | default(omit) }}"
    state: present
  loop: "{{ windows_choco }}"
  loop_control:
    label: "{{ item.name }}"

# PCs de antes do /allusers ficaram com o Bitwarden só na conta da TI: reinstala para todos.
- name: Bitwarden instalado para todas as contas?
  ansible.windows.win_powershell:
    script: |
      $chaves = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
                'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
      $Ansible.Result = [bool](Get-ItemProperty $chaves -ErrorAction SilentlyContinue |
        Where-Object { $_.DisplayName -like 'Bitwarden*' })
      $Ansible.Changed = $false
  register: bitwarden_todos

- name: Reinstalar o Bitwarden para todas as contas
  chocolatey.chocolatey.win_chocolatey:
    name: bitwarden
    install_args: /allusers
    force: true
    state: present
  when: not bitwarden_todos.result

# uBlock Origin e Bitwarden em todo Firefox, instalados à força (mesmas políticas do Linux).
- name: Pasta de políticas do Firefox
  ansible.windows.win_file:
    path: C:\Program Files\Mozilla Firefox\distribution
    state: directory

- name: Políticas do Firefox (extensões)
  ansible.windows.win_copy:
    dest: C:\Program Files\Mozilla Firefox\distribution\policies.json
    content: "{{ firefox_politicas | to_nice_json }}"

# Edge e Chrome só aceitam o uBlock Origin Lite. Vale mesmo se o Chrome for
# instalado depois; o funcionário não consegue remover.
- name: uBlock Origin Lite no Edge e no Chrome
  ansible.windows.win_regedit:
    path: "{{ item.chave }}"
    name: "1"
    data: "{{ item.extensao }}"
    type: string
  loop:
    - navegador: Edge
      chave: HKLM:\SOFTWARE\Policies\Microsoft\Edge\ExtensionInstallForcelist
      extensao: cimighlppcgcoapaliogpjjdehbnofhn;https://edge.microsoft.com/extensionwebstorebase/v1/crx
    - navegador: Chrome
      chave: HKLM:\SOFTWARE\Policies\Google\Chrome\ExtensionInstallForcelist
      extensao: ddkjiahejlhfcafbddmgiahcphecmpfh;https://clients2.google.com/service/update2/crx
  loop_control:
    label: "{{ item.navegador }}"

# Barra de tarefas e área de trabalho só com o Explorador de Arquivos e o Firefox
# (decisão da TI, 31/10/2026). Os programas continuam no menu Iniciar.
- name: Pasta da TI
  ansible.windows.win_file:
    path: C:\ProgramData\TI
    state: directory

- name: Arquivos da barra de tarefas e da área de trabalho
  ansible.windows.win_copy:
    src: "{{ item }}"
    dest: C:\ProgramData\TI\{{ item }}
  loop:
    - barra-de-tarefas.xml
    - area-de-trabalho.ps1

# Vale para todas as contas e volta a cada entrada, mesmo se alguém fixar outro programa.
- name: Barra de tarefas fixa (política de layout)
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\Explorer
    name: "{{ item.nome }}"
    data: "{{ item.valor }}"
    type: "{{ item.tipo }}"
  loop:
    - { nome: StartLayoutFile, valor: 'C:\ProgramData\TI\barra-de-tarefas.xml', tipo: expandstring }
    - { nome: LockedStartLayout, valor: 1, tipo: dword }
  loop_control:
    label: "{{ item.nome }}"

- name: Arrumar a área de trabalho a cada entrada, em todas as contas
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run
    name: TI-AreaDeTrabalho
    data: powershell.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File C:\ProgramData\TI\area-de-trabalho.ps1
    type: string

# Atalhos de todas as contas (instaladores do Chocolatey), menos o do Firefox.
- name: Área de trabalho pública só com o Firefox
  ansible.windows.win_powershell:
    script: |
      $velhos = Get-ChildItem -Path "$env:PUBLIC\Desktop" -File -Force |
        Where-Object { $_.Extension -in '.lnk', '.url' -and $_.BaseName -notlike 'Firefox*' }
      $velhos | Remove-Item -Force
      $Ansible.Changed = [bool]$velhos

- name: Edge sem atalho na área de trabalho nas atualizações
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\EdgeUpdate
    name: "{{ item }}"
    data: 0
    type: dword
  loop:
    - CreateDesktopShortcutDefault
    - CreateDesktopShortcut{56EB18F8-B008-4CBD-B6D2-8C97FE7E9062}

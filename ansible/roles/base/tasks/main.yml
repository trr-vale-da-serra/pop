---
- name: Conferir o nome do computador (POP-TI §3.1)
  ansible.builtin.assert:
    that: inventory_hostname is match('^(POSTOS|SERTAO|TRR)-PC-[0-9]{4}$')
    fail_msg: "Nome fora do padrão <EMPRESA>-PC-<patrimônio>: {{ inventory_hostname }}"

- name: Definir o nome do computador
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
  notify: Pedir reinício

- name: Fuso horário
  community.general.timezone:
    name: "{{ fuso_horario }}"

# Só com módulos do próprio Ansible (o authorized_key do ansible.posix dá aviso
# de recurso obsoleto).
- name: Pasta pessoal da conta da TI
  ansible.builtin.user:
    name: "{{ ansible_user }}"
  register: conta_ti

- name: Pasta .ssh da conta da TI
  ansible.builtin.file:
    path: "{{ conta_ti.home }}/.ssh"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"
  when: ti_chave_ssh_publica | length > 0

- name: Chave SSH do servidor Ansible na conta da TI
  ansible.builtin.lineinfile:
    path: "{{ conta_ti.home }}/.ssh/authorized_keys"
    line: "{{ ti_chave_ssh_publica }}"
    create: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  when: ti_chave_ssh_publica | length > 0

- name: SSH só por chave
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-ti.conf
    content: |
      PasswordAuthentication no
      PermitRootLogin no
    mode: "0644"
  when: ssh_desativar_senha | bool
  notify: Reiniciar ssh

# O instalador do Ubuntu dava só ~100 GB ao sistema e deixava o resto do disco
# parado. Aumenta o sistema até o disco inteiro, com o PC ligado (sem reinstalar).
- name: Sistema com o disco inteiro
  community.general.lvol:
    vg: ubuntu-vg
    lv: ubuntu-lv
    size: +100%FREE
    resizefs: true
  when:
    - "'ubuntu-vg' in ((ansible_facts.lvm | default({})).vgs | default({}))"
    - ansible_facts.lvm.vgs['ubuntu-vg'].free_g | float > 1

- name: Atualizar o sistema
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    autoremove: true

- name: Pacotes de base e idioma
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - language-pack-pt
      - language-pack-gnome-pt
      - curl
      - perl
      - net-tools        # ifconfig
    state: present

- name: Atualização de segurança diária (unattended-upgrades)
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
    mode: "0644"

# O reinício fica para a janela mensal (POP-06), nunca no meio do expediente.
# No PC da TI (o servidor), reinício de segurança às 04:00 (guia do servidor, infra §1).
- name: Reinício do unattended-upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52ti-unattended
    content: |
      Unattended-Upgrade::Automatic-Reboot "{{ 'true' if pc_da_ti | bool else 'false' }}";
      Unattended-Upgrade::Automatic-Reboot-Time "04:00";
    mode: "0644"

---
- name: Conferir o nome do computador (POP-TI §3.1)
  ansible.builtin.assert:
    that: inventory_hostname is match('^(POSTOS|SERTAO|TRR)-PC-[0-9]{4}$')
    fail_msg: "Nome fora do padrão <EMPRESA>-PC-<patrimônio>: {{ inventory_hostname }}"

# O nome novo vale depois do reinício, no fim do playbook.
- name: Definir o nome do computador
  ansible.windows.win_hostname:
    name: "{{ inventory_hostname }}"

- name: Fuso horário
  ansible.windows.win_timezone:
    timezone: "{{ fuso_horario_windows }}"

# O reinício fica para o fim do playbook ou para a janela mensal (POP-06),
# nunca no meio do expediente.
- name: Sem reinício automático com alguém usando o PC
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU
    name: NoAutoRebootWithLoggedOnUsers
    data: 1
    type: dword

# Avisos do Windows Update (drivers, atualizações) não aparecem para o
# funcionário. Os avisos de reinício continuam. Política: no Home pode não valer.
- name: Sem avisos de atualização para o funcionário
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate
    name: "{{ item }}"
    data: 1
    type: dword
  loop:
    - SetUpdateNotificationLevel
    - UpdateNotificationLevel

# Nenhum aviso na tela (decisão da TI, out/2026). É uma opção de cada conta:
# vale para todas porque roda a cada entrada no Windows. Se alguém religar em
# Configurações, desliga de novo na próxima entrada.
- name: Sem avisos na tela, para todas as contas
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run
    name: TI-SemAvisos
    data: reg add HKCU\Software\Microsoft\Windows\CurrentVersion\PushNotifications /v ToastEnabled /t REG_DWORD /d 0 /f
    type: string

# Barra de tarefas só com o menu Iniciar e os programas (decisão da TI, out/2026).
# Políticas valem para todas as contas; aparecem depois de sair e entrar de novo.
- name: Barra de tarefas sem Pesquisa, Visão de tarefas e Widgets
  ansible.windows.win_regedit:
    path: "{{ item.chave }}"
    name: "{{ item.nome }}"
    data: "{{ item.valor }}"
    type: dword
  loop:
    - { chave: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Search', nome: SearchOnTaskbarMode, valor: 0 }
    - { chave: 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer', nome: HideTaskViewButton, valor: 1 }
    - { chave: 'HKLM:\SOFTWARE\Policies\Microsoft\Dsh', nome: AllowNewsAndInterests, valor: 0 }
  loop_control:
    label: "{{ item.nome }}"

- name: Horário de trabalho (o Windows Update não reinicia nesse intervalo)
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\WindowsUpdate\UX\Settings
    name: "{{ item.nome }}"
    data: "{{ item.valor }}"
    type: dword
  loop:
    - { nome: ActiveHoursStart, valor: "{{ horario_inicio }}" }
    - { nome: ActiveHoursEnd, valor: "{{ horario_fim }}" }

- name: Atualizações do Windows
  ansible.windows.win_updates:
    category_names:
      - SecurityUpdates
      - CriticalUpdates
      - UpdateRollups
      - DefinitionUpdates
      - Updates
    reboot: "{{ reiniciar | default(true) | bool }}"
    reboot_timeout: 3600

# Antivírus = Microsoft Defender (anexos/ferramentas.md §1).
- name: Atualizar o Microsoft Defender
  ansible.windows.win_powershell:
    script: Update-MpSignature
  changed_when: false

- name: Ler o estado do Microsoft Defender
  ansible.windows.win_powershell:
    script: |
      $s = Get-MpComputerStatus
      $Ansible.Result = @{ antivirus = $s.AntivirusEnabled; tempo_real = $s.RealTimeProtectionEnabled }
      $Ansible.Changed = $false
  register: defender

- name: Conferir que o antivírus está ativo (POP-05 §4.2)
  ansible.builtin.assert:
    that:
      - defender.result.antivirus
      - defender.result.tempo_real
    fail_msg: "Microsoft Defender desligado. Outro antivírus instalado? Conferir no PC."

---
# POP-TI §3.1: Dash to Panel (barra embaixo) e ArcMenu (menu Iniciar).
- name: Programas para instalar as extensões
  ansible.builtin.apt:
    name: [unzip, libglib2.0-bin]
    state: present

- name: Versão do GNOME
  ansible.builtin.command: gnome-shell --version
  register: gnome_versao
  changed_when: false

- name: Procurar as extensões no extensions.gnome.org
  ansible.builtin.uri:
    url: "https://extensions.gnome.org/extension-info/?uuid={{ item }}&shell_version={{ gnome_versao.stdout.split()[-1].split('.')[0] }}"
    return_content: true
  loop: "{{ gnome_extensoes }}"
  register: gnome_info

- name: Pasta das extensões baixadas
  ansible.builtin.file:
    path: /var/cache/ti-extensoes
    state: directory
    mode: "0755"

# O nome do arquivo tem a versão: só baixa de novo quando sai versão nova.
- name: Baixar as extensões
  ansible.builtin.get_url:
    url: "https://extensions.gnome.org{{ item.json.download_url }}"
    dest: "/var/cache/ti-extensoes/{{ item.item }}-v{{ item.json.version }}.zip"
    mode: "0644"
  loop: "{{ gnome_info.results }}"
  loop_control:
    label: "{{ item.item }} v{{ item.json.version }}"
  register: gnome_zip

- name: Apagar a versão antiga
  ansible.builtin.file:
    path: "/usr/share/gnome-shell/extensions/{{ item.item.item }}"
    state: absent
  loop: "{{ gnome_zip.results }}"
  loop_control:
    label: "{{ item.item.item }}"
  when: item.changed

- name: Pasta da extensão
  ansible.builtin.file:
    path: "/usr/share/gnome-shell/extensions/{{ item }}"
    state: directory
    mode: "0755"
  loop: "{{ gnome_extensoes }}"

- name: Instalar as extensões para todos os usuários
  ansible.builtin.unarchive:
    src: "{{ item.dest }}"
    dest: "/usr/share/gnome-shell/extensions/{{ item.item.item }}"
    remote_src: true
    mode: "u=rwX,go=rX"
  loop: "{{ gnome_zip.results }}"
  loop_control:
    label: "{{ item.item.item }}"
  when: item.changed
  notify: Pedir reinício

- name: Compilar as configurações das extensões
  ansible.builtin.shell: |
    d=/usr/share/gnome-shell/extensions/{{ item.item.item }}/schemas
    [ -d "$d" ] && glib-compile-schemas "$d" || true
  loop: "{{ gnome_zip.results }}"
  loop_control:
    label: "{{ item.item.item }}"
  when: item.changed
  changed_when: true

- name: Perfil do dconf com padrões da empresa
  ansible.builtin.copy:
    dest: /etc/dconf/profile/user
    content: |
      user-db:user
      system-db:local
    mode: "0644"
  notify: Atualizar dconf

- name: Pasta de padrões do dconf
  ansible.builtin.file:
    path: /etc/dconf/db/local.d
    state: directory
    mode: "0755"

# Vale para quem ainda não mudou essas opções; cada usuário novo já entra assim.
# A barra e o menu aparecem depois de sair e entrar de novo (ou reiniciar).
- name: Ligar Dash to Panel e ArcMenu, desligar o dock do Ubuntu
  ansible.builtin.copy:
    dest: /etc/dconf/db/local.d/00-ti-aparencia
    content: |
      [org/gnome/shell]
      enabled-extensions=['dash-to-panel@jderose9.github.com', 'arcmenu@arcmenu.com']
      disabled-extensions=['ubuntu-dock@ubuntu.com']
    mode: "0644"
  notify: [Atualizar dconf, Pedir reinício]

# Nenhum aviso aparece na tela do funcionário (decisão da TI, out/2026): modo
# "Não perturbe" travado. Os avisos ficam guardados no menu do relógio.
# Atualização, firmware/driver e erro também saem da fila: a TI atualiza pelo
# unattended-upgrades e pela janela mensal (POP-06).
- name: Sem avisos na tela do funcionário
  ansible.builtin.copy:
    dest: /etc/dconf/db/local.d/01-ti-avisos
    content: |
      [org/gnome/desktop/notifications]
      show-banners=false

      [org/gnome/software]
      allow-updates=false
      download-updates=false
      download-updates-notify=false

      [com/ubuntu/update-notifier]
      auto-launch=false
      no-show-notifications=true
      show-apport-crashes=false
    mode: "0644"
  notify: Atualizar dconf

- name: Pasta de travas do dconf
  ansible.builtin.file:
    path: /etc/dconf/db/local.d/locks
    state: directory
    mode: "0755"

# Travado: o funcionário não consegue ligar os avisos de novo.
- name: Travar os avisos desligados
  ansible.builtin.copy:
    dest: /etc/dconf/db/local.d/locks/01-ti-avisos
    content: |
      /org/gnome/desktop/notifications/show-banners
      /org/gnome/software/allow-updates
      /org/gnome/software/download-updates
      /org/gnome/software/download-updates-notify
      /com/ubuntu/update-notifier/auto-launch
      /com/ubuntu/update-notifier/no-show-notifications
      /com/ubuntu/update-notifier/show-apport-crashes
    mode: "0644"
  notify: Atualizar dconf

# Janela "o Ubuntu encontrou um erro interno".
- name: Ver se o relatório de erros (apport) está instalado
  ansible.builtin.stat:
    path: /etc/default/apport
  register: apport

- name: Sem janela de relatório de erros
  ansible.builtin.lineinfile:
    path: /etc/default/apport
    regexp: '^enabled='
    line: enabled=0
  when: apport.stat.exists

- name: Relatório de erros desligado
  ansible.builtin.service:
    name: apport
    state: stopped
    enabled: false
  when: apport.stat.exists

# Os snaps (Firefox, Bitwarden) se atualizam à noite, com os programas fechados:
# sem o aviso "feche o programa para atualizar".
- name: Ler o horário de atualização dos snaps
  ansible.builtin.command: snap get system refresh.timer
  register: snap_horario
  changed_when: false
  failed_when: false

- name: Snaps atualizam à noite
  ansible.builtin.command: snap set system refresh.timer={{ snap_horario_atualizacao }}
  when: snap_horario.stdout | trim != snap_horario_atualizacao

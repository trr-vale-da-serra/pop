---
# Programas padrão (POP-04 §4.2). Programa novo segue o POP-08 e entra nesta lista.
- name: Programas padrão (apt)
  ansible.builtin.apt:
    name: "{{ apps_apt }}"
    state: present

- name: Navegador (snap)
  community.general.snap:
    name: firefox
    state: present

# uBlock Origin em todo Firefox, instalado à força: o usuário não consegue remover.
# O Firefox (snap) lê as políticas de /etc/firefox/policies.
- name: Pasta de políticas do Firefox
  ansible.builtin.file:
    path: /etc/firefox/policies
    state: directory
    mode: "0755"

- name: Políticas do Firefox (bloqueador de anúncios)
  ansible.builtin.copy:
    dest: /etc/firefox/policies/policies.json
    content: "{{ firefox_politicas | to_nice_json }}"
    mode: "0644"

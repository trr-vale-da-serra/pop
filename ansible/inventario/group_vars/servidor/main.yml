---
# Conta administradora da TI no servidor. Senha no Vaultwarden.
ansible_user: ti
ansible_become: true
# Ubuntu 26.04 usa o sudo-rs, cuja pergunta de senha o Ansible não reconhece.
ansible_become_exe: sudo.ws

# --- Discos da gaveta USB-C (modo JBOD / discos separados, nunca o RAID da gaveta) ---
# IDs em /dev/disk/by-id (não usar /dev/sdX: muda a cada reinício). Para ver:
#   ls -l /dev/disk/by-id/ | grep -v part
# Cada disco precisa aparecer com um número de série diferente. Se a gaveta mostrar o
# mesmo ID para todos, ela não serve para o espelho.
disco_nuvem_1: /dev/disk/by-id/TROCAR-disco-1
disco_nuvem_2: /dev/disk/by-id/TROCAR-disco-2
disco_backup: /dev/disk/by-id/TROCAR-disco-3

# Espelho ZFS (discos 1 e 2), montado em /dados.
zfs_pool: dados
# Uma pasta (dataset) por uso. Cada uma tem os próprios snapshots e pode ter cota.
zfs_datasets:
  - nome: usuarios                 # pasta pessoal de cada funcionário (cota por pessoa)
  - nome: departamentos            # pasta de cada departamento
  - nome: whatsapp                 # pastas do WhatsApp dos celulares (POP-TI §4.3)
  - nome: emails-ex-funcionarios   # caixas de quem saiu (POP-02)
  - nome: apps-empresa             # APKs da própria empresa (POP-08)

# Snapshots automáticos do espelho (sanoid): quantos de cada tipo guardar.
snapshots_hora: 24
snapshots_dia: 30
snapshots_mes: 6

# --- Nuvem da empresa (pastas compartilhadas, Samba) ---
# IP do servidor na rede da empresa: \\<IP>\<pasta> no Windows, smb://<IP>/<pasta> no Ubuntu.
nuvem_endereco: TROCAR-IP-DO-SERVIDOR
# Redes que podem abrir as pastas e mandar o WhatsApp (o resto é recusado).
redes_internas:
  - 10.10.10.0/24      # PCs
  - 10.10.20.0/24      # celulares
  - 192.168.170.0/24   # LAN antiga (PCs e celulares misturados)

# Uma pasta por departamento, aberta só para quem está nele.
departamentos:
  - financeiro
  - rh
  - comercial
  - operacional

# Uma conta por funcionário (POP-01), com pasta pessoal que só ele e a TI abrem.
# Senhas no vault.yml (senhas_samba). Quem saiu (POP-02): ativo: false (os arquivos ficam).
cota_padrao: 50G
usuarios_samba: []
  # - nome: joao.silva
  #   departamentos: [financeiro]
  #   cota: 100G          # opcional; sem ela vale a cota_padrao
  #   ativo: false        # opcional; só para quem saiu

# Cota de cada pessoa na pasta pessoal (propriedade userquota@ do ZFS, aplicada pela
# role arquivos depois de criar as contas).
cotas_usuarios: >-
  {{ dict(usuarios_samba | map(attribute='nome') | map('regex_replace', '^', 'userquota@')
     | zip(usuarios_samba | map(attribute='cota', default=cota_padrao))) }}

# --- WhatsApp dos celulares (Syncthing) ---
syncthing_porta_painel: 47921      # painel do Syncthing (só a TI), porta fora do comum

# --- Backup no disco 3 (sem criptografia) ---
backup_bancos_guarda: 30           # dumps de cada banco (um por dia)
backup_vm_guarda: 2                # exportações da VM (uma por semana)
backup_vm_nome: prod               # VM dos sistemas (checkvale/docs/infra.md)
# Uptime Kuma: URL de um monitor do tipo "Push". Sem push no dia, ele alerta a TI.
# Vazio = sem alerta.
backup_push_url: ""

# Um item por banco. tipo: postgres (pg_dump) ou sqlite (.dump).
# ssh: conta@IP da VM, quando o banco roda nela. Sem ssh = roda no próprio servidor.
# A chave SSH do root do servidor precisa estar na conta da VM (o playbook mostra a chave).
backup_bancos:
  - nome: checkvale
    tipo: postgres
    ssh: ti@192.168.122.10         # VM prod: conferir com `virsh domifaddr prod`
    compose: /srv/checkvale/deploy/compose.prod.yml
    servico: postgres
    usuario: checkvale
    banco: checkvale
  # VS Autonomus: entra quando migrar para a VM (/srv/vs). Enquanto for SQLite:
  # - nome: vs-plataforma
  #   tipo: sqlite
  #   ssh: ti@192.168.122.10
  #   arquivo: /srv/vs/plataforma/plataforma.db

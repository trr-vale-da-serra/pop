---
# Valem para Linux e Windows. O que é de um só fica em group_vars/linux ou windows.

# Conta dos funcionários (POP-TI §3.1): a mesma dos pendrives (gerar.py).
conta_funcionarios: usuario

# PC da TI (o servidor, que também é a estação de trabalho da TI): a conta dos
# funcionários fica, mas com senha para entrar e para o sudo e sem login automático;
# avisos na tela e reinício de segurança às 04:00. Marcar no host do inventário:
# pc_da_ti: true.
pc_da_ti: false

# --- Servidores dos agentes (POP-TI §5.2). Vazio = o agente é pulado. ---
meshcentral_url: ""          # ex.: https://mesh.trrvaledaserra.com.br
# meshcentral_meshid: no vault.yml (ID do grupo de dispositivos do MeshCentral)
glpi_url: https://glpi.vsautonomus.com.br/   # ferramentas_ti no TRR-PC-0003 (glpi_endereco)

# AnyDesk só nos PCs que recebem suporte de fornecedor (marcar no host).
anydesk: false

# Políticas do Firefox: https://mozilla.github.io/policy-templates/
# uBlock Origin e Bitwarden instalados à força: o funcionário não consegue remover.
firefox_politicas:
  policies:
    ExtensionSettings:
      uBlock0@raymondhill.net:
        installation_mode: force_installed
        install_url: https://addons.mozilla.org/firefox/downloads/latest/ublock-origin/latest.xpi
      "{446900e4-71c2-419f-a6a7-df9c091e268b}":   # Bitwarden (cofre de senhas)
        installation_mode: force_installed
        install_url: https://addons.mozilla.org/firefox/downloads/latest/bitwarden-password-manager/latest.xpi

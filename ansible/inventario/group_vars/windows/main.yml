---
# Acesso do Ansible ao Windows: WinRM, ligado pelo pendrive (autounattend.xml).
# Conta local da TI (POP-05 §4.1, passo 3). Senha no Vaultwarden: rodar com -k.
ansible_user: ti
ansible_connection: winrm
ansible_port: 5985
ansible_winrm_scheme: http
# NTLM criptografa o conteúdo mesmo pelo http. Só aceita da mesma rede (firewall do PC).
ansible_winrm_transport: ntlm

fuso_horario_windows: E. South America Standard Time

# Programas padrão pelo Chocolatey. Mudou a lista? Atualizar anexos/ferramentas.md §5.
windows_choco:
  - name: firefox
    params: /l:pt-BR
  - name: libreoffice-still
  - name: bitwarden          # cofre de senhas (app)

# Agentes (servidores em group_vars/all). Versão vazia = agente pulado.
glpi_agent_versao: "1.21"    # github.com/glpi-project/glpi-agent/releases

# Horário de trabalho: o Windows não reinicia sozinho para atualizar nesse intervalo.
horario_inicio: 7
horario_fim: 19
